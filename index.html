<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视差效果</title>
  <link rel="stylesheet" href="style.css">
</head>
<!-- 在 <body> 最前面加一个不可见的点击区域 -->
<div style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;cursor:default;" id="clickCatcher"></div>
<body>
  <div class="scene" id="scene">
    <img class="layer layer-bg" src="背景图.png" alt="背景">
    <img class="layer layer-fg" src="前景图.png" alt="前景">
  </div>

  <audio id="bgm" loop autoplay>
    <source src="Сова-Гроза.mp3" type="audio/mpeg">
  </audio>

  <button id="musicBtn" class="music-btn">🔇</button>
  <script src="script.js"></script>
</body>
</html>
